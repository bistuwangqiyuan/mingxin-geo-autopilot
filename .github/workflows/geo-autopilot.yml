name: GEO Autopilot (every 6h)

# 中科存储官网全自动 GEO 系统 · 云端无人值守运行。
# 触发：每 6 小时定时 cron（每天 4 次）+ 手动 workflow_dispatch。
# 每次运行都做完整流水线（含付费 GVI 真实重测 + 内容自进化 + IndexNow + 线上审计 + 部署）。
# 仓库布局（zk-geo-autopilot）：geo_autopilot/ + geo_plan/ + seo_geo_loop/ + business_plan/outputs/results.json
# CI 把官网/知识库仓库 clone 为同级目录，paths.py 零改动即可解析。

on:
  schedule:
    # 每 6 小时一次（UTC）= 北京时间 06:30 / 12:30 / 18:30 / 00:30
    - cron: "30 22 * * *"
    - cron: "30 4 * * *"
    - cron: "30 10 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        default: "ci"
        type: choice
        options: ["ci", "once"]
      gvi_limit:
        description: "每模型 GVI 采样上限(0=全部)"
        default: "0"

permissions:
  contents: write
  issues: write

concurrency:
  group: geo-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      ZK_ALERT_REPO: ${{ github.repository }}
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout autopilot repo (engine)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node (for bailian-cli)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r geo_autopilot/requirements.txt
          python -m playwright install --with-deps chromium
          npm i -g bailian-cli
          bl --version || true

      - name: Clone site repos (siblings)
        run: |
          AUTH="https://x-access-token:${GH_PAT}@github.com"
          git clone --depth 1 "${AUTH}/${{ github.repository_owner }}/zhongke-dpu-official.git" official_website
          git clone --depth 1 "${AUTH}/${{ github.repository_owner }}/zk-storage-kb.git" offsite_github
          git config --global user.name  "geo-autopilot[bot]"
          git config --global user.email "geo-autopilot@users.noreply.github.com"

      - name: Run GEO Autopilot
        run: |
          MODE="${{ github.event.inputs.mode || 'ci' }}"
          GVI="${{ github.event.inputs.gvi_limit || '0' }}"
          python geo_autopilot/autopilot.py --${MODE} --gvi-limit ${GVI}

      - name: Commit autopilot data (history/reports/outputs)
        if: always()
        run: |
          git config --global user.name  "geo-autopilot[bot]"
          git config --global user.email "geo-autopilot@users.noreply.github.com"
          git add geo_autopilot/history geo_autopilot/reports geo_autopilot/outputs 2>/dev/null || true
          git commit -m "chore(autopilot): run $(date -u +%FT%TZ) data & report" || echo "no changes"
          # 高频运行下远端可能已被上一次运行推进：先 rebase 再推，避免 non-fast-forward
          git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push skipped"

      - name: Upload daily report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-daily-report
          path: |
            geo_autopilot/reports/*.pdf
            geo_autopilot/reports/*.html
            geo_autopilot/outputs/run_log.json
          if-no-files-found: warn
