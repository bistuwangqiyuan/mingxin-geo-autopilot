name: GEO Autopilot (twice daily)

# 铭信官网（mingxinstorage.xyz）全自动 GEO 系统 · 云端无人值守运行。
# 触发：每天 2 次定时 cron + 手动 workflow_dispatch。
# 每次运行都做完整流水线（热词挖掘 + GVI 真实重测 + 内容自进化 + 多点分发 + IndexNow + 线上审计 + 部署 + 流量信号检测）。
# 仓库布局（mingxin-geo-autopilot）：geo_autopilot/ + geo_plan/ + seo_geo_loop/ + business_plan/outputs/results.json
# CI 把公开的知识库仓 clone 为同级目录 offsite_github/，paths.py 零改动即可解析。
# 官网仓 amd 不再参与：内容自进化产出经 HTTPS 提交给 mingxinstorage.xyz 的
# /api/engine/autopilot-faq 落库并即时上线（鉴权用本仓已有的 CRON_SECRET）。
#
# ── 2026-07-25 停摆事故与本次改动（依据可复现，勿轻易回退）───────────────────
#
# 事实：2026-07-21 起本 workflow 连续 28 次 conclusion=failure，每次 job 在
# 2 秒内结束且 steps 总数为 0（runner 从未启动）。GitHub 返回的注解原文是：
#   "The job was not started because recent account payments have failed
#    or your spending limit needs to be increased."
# 同一时刻账户下多个互不相关的私有仓库同时出现同一注解 —— 这是**账户级计费
# 拒绝**，不是本仓库的代码或配置故障。诊断脚本可复现：
#   python scripts/actions_diagnose.py        # 失败模式与 PAT 有效期
#   python scripts/actions_annotations.py     # GitHub 注解原文
#   python scripts/actions_account_health.py  # 证明是账户级而非单仓库
#   python scripts/actions_usage_account.py --out reports/actions_usage.json
#
# **并且已排除"免费额度耗尽"这一最初假设**：完整枚举账户 583 个仓库（421 个
# 私有，枚举未被截断）后，本月私有仓库合计计费 1095 分钟 / 免费额度 2000 分钟，
# 未超额；且因所有运行的 billable 字段为 0、用墙钟时长做上界估算，真实值只会更低。
# 证据见 reports/actions_usage.json。所以停摆的原因是**付款失败**，不是用量。
#
# ── 2026-07-26 停摆的实际解法：迁移到公开仓库 ──────────────────────────────
#
# 账户级计费拒绝只能由人处理账单来解除，但 GitHub 托管 runner 对**公开仓库**
# 免费无限量，因此本引擎迁到了新建的公开仓库 bistuwangqiyuan/mingxin-geo-autopilot，
# 绕开了计费这条链路（旧仓库 zk-geo-autopilot 已归档，保持私有）。
#
# 为什么不是把旧仓库直接翻公开：旧仓库虽已用 git filter-repo 清过历史，但
# force push 后 GitHub 并不销毁不可达对象，且其 API 接受 **4 位**短 SHA
# （实测 `gh api repos/.../commits/a5d8` 即解析出完整 SHA），穷举空间仅
# 16^4 = 65536，约 13 小时可枚举完。翻公开等于公开那些已删除的历史。
# 新仓库的对象库从未收到过这些对象，同一查询返回 422 No commit found。
#
# 公开带来的新硬性要求：本 workflow 每次运行都会把数据回写提交，而提交即发布。
# 因此提交前必须过敏感信息闸门（见下方 scan gate 步骤），命中即失败且不提交。
#
# 下面的用量瘦身对公开仓库已非必需，但予以保留：它降低单次运行时长，
# 也保证将来若迁回私有仓库不会立刻触顶。
#
# 本次改动做的是账单恢复后立刻生效、且降低将来触顶概率的用量瘦身
# （6 次/天对一个日更站点本就过量，账户总用量的大头也不在本仓库）：
#   1. cron 6 次/天 → 2 次/天（-67% 运行次数）
#   2. timeout-minutes 50 → 25（失控运行的计费上界砍半）
#   3. pip 依赖缓存（setup-python cache: pip）
#   4. Playwright Chromium 缓存（命中时只装系统依赖，省去每次下载浏览器）
#   5. bailian-cli 仅在决策脑回退链需要时安装，并缓存 npm 全局目录
# 每一项都只减少"每次运行的固定开销"，不削减流水线的实际业务动作。

on:
  schedule:
    # 每天 2 次（UTC）= 北京时间 08:30 与 20:30
    - cron: "30 0 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        default: "ci"
        type: choice
        options: ["ci", "once"]
      gvi_limit:
        description: "每模型 GVI 采样上限(0=全部)"
        default: "0"

permissions:
  contents: write
  issues: write

concurrency:
  group: geo-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # 首选 LLM 决策脑：Vercel AI Gateway（OpenAI 兼容）。缺失则回退多厂商直连链→bl/DashScope→规则脑。
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      # 多模型 GVI 实测 + 决策脑回退链（密钥在即自动纳入，缺失优雅跳过，绝不编造）
      TONGYI_API_KEY: ${{ secrets.TONGYI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
      SPARK_API_KEY: ${{ secrets.SPARK_API_KEY }}
      DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # GH_PAT 现在只用于 push 公开的知识库仓 mingxin-storage-kb（可选，缺失只影响该仓回写）。
      # 官网仓 amd 已不再 clone/push —— 内容产出走站点 API，见 Clone 步骤的说明。
      GH_PAT: ${{ secrets.GH_PAT }}
      # 而 alerting.py 是在**本仓库**开告警 issue，内置 GITHUB_TOKEN 即可胜任。
      # 回退到它，是为了让「PAT 缺失/过期」这件事本身还能被告警出来——
      # 若两者绑死，PAT 一旦失效，连报警能力都一起失效（这正是上次 5 天无人发现的成因）。
      GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      # 铭信站点自带引擎/SEO 接口鉴权（/api/seo/ping、/api/engine/*）
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      MX_ALERT_REPO: ${{ github.repository }}
      # GA4（可选，提供即自动激活）：MX_GA4_ID=埋码 Measurement ID；PROPERTY_ID+SA_JSON=Data API 读流量信号。
      MX_GA4_ID: ${{ secrets.MX_GA4_ID }}
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      GA4_SA_JSON: ${{ secrets.GA4_SA_JSON }}
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout autopilot repo (engine)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: geo_autopilot/requirements.txt

      - name: Setup Node (for bailian-cli fallback)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r geo_autopilot/requirements.txt

      # Chromium 每次重新下载约占单次运行的最大固定开销，缓存后只需装系统依赖。
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('geo_autopilot/requirements.txt') }}

      - name: Install Playwright (full)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      # bl 是决策脑回退链的第 3 顺位，仅在 AI Gateway 与各厂商直连全部不可用时才会被调用。
      # 缓存 npm 全局目录，避免为一个低频回退项每次付出安装时间。
      - name: Cache npm global (bailian-cli)
        id: npm-global-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: npm-global-bailian-${{ runner.os }}

      - name: Install bailian-cli
        run: |
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/bl" ]; then
            npm i -g bailian-cli || echo "bailian-cli install failed; brain will fall back further"
          fi

      - name: Sensitive scan gate (repo hygiene, pre-run)
        run: |
          # 体检已入库的内容：闸门的第二道（第一道在提交前扫暂存区）。
          # 这一道拦的是绕过引擎、由人直接 push 进来的敏感内容。
          python tools/scan_sensitive.py --worktree .

      - name: Clone knowledge-base repo (sibling)
        run: |
          # ── 2026-08-08：不再 clone 私有的官网仓 amd ────────────────────────
          # 原来这一步在缺 GH_PAT 时直接 exit 1，导致本 workflow 连续 20 次失败、
          # 静默 5 天。但排查后发现，引擎对 amd 仓的全部「依赖」只是：把自己产出的
          # autopilot_faq.json 写进去、再读回来去重——而**站点代码从来没有读过那个
          # 文件**，整条链路即便跑通也不产生任何对外效果。
          # 现在产出改经 HTTP 提交给站点 /api/engine/autopilot-faq 落库并即时上线，
          # 于是私有仓的 clone/push 需求整个消失，GH_PAT 也不再需要。
          # 顺带消掉一个安全面：公开仓的 CI 不必再持有私有主仓的写权限。
          #
          # 知识库仓是公开仓，匿名即可 clone；仍需 push，故用内置 GITHUB_TOKEN 无权限，
          # 有 GH_PAT 时用之，没有则只读克隆、提交步骤会如实记录推送失败。
          if [ -n "${GH_PAT}" ]; then
            KB_URL="https://x-access-token:${GH_PAT}@github.com/${{ github.repository_owner }}/mingxin-storage-kb.git"
          else
            KB_URL="https://github.com/${{ github.repository_owner }}/mingxin-storage-kb.git"
          fi
          git clone --depth 1 "${KB_URL}" offsite_github || echo "kb repo unavailable; offsite KB steps will be skipped"
          git config --global user.name  "geo-autopilot[bot]"
          git config --global user.email "geo-autopilot@users.noreply.github.com"

      - name: Run GEO Autopilot
        run: |
          MODE="${{ github.event.inputs.mode || 'ci' }}"
          # 降频到 2 次/天后每次可承担更多采样：定时运行的 GVI 上限从 4 提到 8。
          GVI="${{ github.event.inputs.gvi_limit || '8' }}"
          python geo_autopilot/autopilot.py --${MODE} --gvi-limit ${GVI}

      - name: Commit autopilot data (history/reports/outputs)
        if: always()
        run: |
          git config --global user.name  "geo-autopilot[bot]"
          git config --global user.email "geo-autopilot@users.noreply.github.com"
          git add geo_autopilot/history geo_autopilot/reports geo_autopilot/outputs geo_plan/offsite/en_kit 2>/dev/null || true
          # 敏感信息闸门：仓库已公开，提交即对外发布，故扫描暂存区里将被发布的确切
          # 内容。命中即以退出码 1 结束本步骤，提交不会发生。这一行**不得**加
          # `|| true` —— 那会让闸门形同虚设。
          # 已知盲区（如实记录）：扫描器的 SKIP_EXT 跳过 .pdf，日报 PDF 由同批
          # 扫描过的 HTML 派生，属间接覆盖。
          python tools/scan_sensitive.py --staged .
          git commit -m "chore(autopilot): run $(date -u +%FT%TZ) data & report" || echo "no changes"
          # 远端可能已被上一次运行推进：先 rebase 再推，避免 non-fast-forward
          git pull --rebase origin "${GITHUB_REF_NAME}" || git rebase --abort || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push skipped"

      - name: Alert on failure (dedup issue)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # alerting.py 跑在引擎内部、提交步骤之前，因此扫描闸门拦截或推送失败时
          # 它已经结束、发不出告警。这一步补上那段盲区。
          # 去重：同名 issue 已开着就只追加评论，避免每次运行刷一个新 issue。
          TITLE="[autopilot] 运行失败：需人工查看"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="运行 \`${{ github.run_id }}\` 失败（触发方式 \`${{ github.event_name }}\`）。

          若失败步骤是 **Sensitive scan gate**，说明有敏感内容试图进入这个**公开**仓库，
          提交已被阻止、未发布。请先看日志里的命中项，再决定是补 .gitignore 规则
          还是修数据来源。

          日志：${URL}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY" || echo "comment failed"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "" || gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Upload daily report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-daily-report
          path: |
            geo_autopilot/reports/*.pdf
            geo_autopilot/reports/*.html
            geo_autopilot/outputs/run_log.json
          if-no-files-found: warn
